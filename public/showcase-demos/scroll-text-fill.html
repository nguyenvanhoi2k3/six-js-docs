<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Text Fill demo</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        overflow-x: hidden;
        background-color: #0a0d14;
        color: #e1dcc9;
        font-family: sans-serif;
      }

      .spacer {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.4;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .reading {
        max-width: 900px;
        text-align: center;
        margin: 0 auto;
        padding: 25vh 24px;
        font-size: clamp(22px, 3.4vw, 50px);
        line-height: 1.3;
        text-transform: uppercase;
        font-weight: 900;
      }
    </style>
  </head>

  <body>
    <div class="spacer">scroll down ↓</div>

    <div class="reading">
      <p id="text">
        Text starts dim as it enters the bottom of the screen, then brightens
        as you scroll, as if a light were following the rhythm of your
        reading.
      </p>
    </div>

    <div class="spacer" style="opacity: 0.15">— the end —</div>

    <script type="module">
      import { six } from "https://unpkg.com/@six-js/core@latest/dist/index.js";
      import { SplitText } from "https://unpkg.com/@six-js/core@latest/dist/SplitText.js";

      document.addEventListener("DOMContentLoaded", () => {
        const split = new SplitText("#text", {
          type: "chars, lines",
          charsClass: "char",
          linesClass: "line",
        });

        six.set(split.chars, { opacity: 0.15 }); // dim by default

        const master = six.timeline({
          onScroll: {
            trigger: document.getElementById("text"),
            start: "top 95%",
            end: "bottom 40%",
            sync: 0.3,
          },
        });

        split.lines.forEach((line) => {
          const chars = six.utils.arrayOf(line.querySelectorAll(".char"));
          if (!chars.length) return;

          master.to(chars, {
            opacity: 1,
            ease: "none",
            stagger: 0.5,
          });
        });
      });
    </script>
  </body>
</html>
