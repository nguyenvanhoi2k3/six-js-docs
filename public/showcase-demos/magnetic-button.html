<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnetic Buttons demo</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        overflow-x: hidden;
        background-color: #0a0d14;
        color: #e1dcc9;
        font-family: sans-serif;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 40px 24px;
      }
      .demo-grid {
        width: 100%;
        max-width: 980px;
        margin: 0 auto;
        padding: 0 24px 56px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
      }

      .magnet-card {
        background: #12151f;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }
      .magnet-card h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #ffd166;
      }

      .magnet-zone {
        width: 100%;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .magnet-btn {
        font: inherit;
        font-size: 14px;
        padding: 14px 28px;
        border-radius: 999px;
        border: 1px solid rgba(120, 165, 238, 0.4);
        background: rgba(120, 165, 238, 0.12);
        color: #b4d4ff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
      }

      .magnet-btn__label {
        display: inline-block;
        will-change: transform;
      }

      .magnet-btn--field {
        background: #ffd166;
        border-color: transparent;
        color: #0a0d14;
      }
    </style>
  </head>

  <body>
    <div class="hero">
      <h1>Magnetic buttons</h1>
    </div>

    <div class="demo-grid">
      <div class="magnet-card">
        <h2>Layered</h2>
        <div class="magnet-zone">
          <button class="magnet-btn" id="btnLayered">
            <span class="magnet-btn__label">Hover me</span>
          </button>
        </div>
      </div>

      <div class="magnet-card">
        <h2>Field</h2>
        <div class="magnet-zone">
          <button class="magnet-btn magnet-btn--field" id="btnField" data-radius="140">Lại gần xem</button>
        </div>
      </div>

      <div class="magnet-card">
        <h2>Rotate</h2>
        <div class="magnet-zone">
          <button class="magnet-btn" id="btnRotate">Nghiêng theo tay</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { six } from "https://unpkg.com/@six-js/core@latest/dist/index.js";
      import { Watcher } from "https://unpkg.com/@six-js/core@latest/dist/Watcher.js";

      const $ = (sel) => document.querySelector(sel);

      // ---------------- Layered ----------------
      const btnLayered = $("#btnLayered");
      const labelLayered = btnLayered.querySelector(".magnet-btn__label");

      Watcher({
        target: btnLayered,
        type: "pointer",
        onMove: (self) => {
          const rect = btnLayered.getBoundingClientRect();
          const relX = self.x - (rect.left + rect.width / 2);
          const relY = self.y - (rect.top + rect.height / 2);
          six.to(btnLayered, { x: relX * 0.25, y: relY * 0.25, duration: 0.3, ease: "quadOut", overwrite: "auto" });
          six.to(labelLayered, { x: relX * 0.5, y: relY * 0.5, duration: 0.3, ease: "quadOut", overwrite: "auto" });
        },
        onHoverEnd: () => {
          six.to(btnLayered, { x: 0, y: 0, duration: 0.7, ease: "elasticOut", overwrite: "auto" });
          six.to(labelLayered, { x: 0, y: 0, duration: 0.7, ease: "elasticOut", overwrite: "auto" });
        },
      });

      // ---------------- Field ----------------
      const btnField = $("#btnField");
      const fieldRadius = Number(btnField.dataset.radius) || 140;
      let wasInField = false;

      Watcher({
        target: window,
        type: "pointer",
        onMove: (self) => {
          const rect = btnField.getBoundingClientRect();
          const dx = self.x - (rect.left + rect.width / 2);
          const dy = self.y - (rect.top + rect.height / 2);
          const dist = Math.hypot(dx, dy);
          const inField = dist < fieldRadius;

          if (inField) {
            const pull = 1 - dist / fieldRadius; // càng gần tâm nút càng hút mạnh
            six.to(btnField, { x: dx * pull * 0.8, y: dy * pull * 0.8, duration: 0.4, ease: "quadOut", overwrite: "auto" });
          } else if (wasInField) {
            six.to(btnField, { x: 0, y: 0, duration: 0.7, ease: "elasticOut", overwrite: "auto" });
          }
          wasInField = inField;
        },
      });

      // ---------------- Rotate ----------------
      const btnRotate = $("#btnRotate");

      Watcher({
        target: btnRotate,
        type: "pointer",
        onMove: (self) => {
          const rect = btnRotate.getBoundingClientRect();
          const relX = self.x - (rect.left + rect.width / 2);
          const relY = self.y - (rect.top + rect.height / 2);
          six.to(btnRotate, {
            x: relX * 0.5,
            y: relY * 0.5,
            rotate: relX * 0.08,
            duration: 0.3,
            ease: "quadOut",
            overwrite: "auto",
          });
        },
        onHoverEnd: () => {
          six.to(btnRotate, { x: 0, y: 0, rotate: 0, duration: 0.7, ease: "elasticOut", overwrite: "auto" });
        },
      });
    </script>
  </body>
</html>
