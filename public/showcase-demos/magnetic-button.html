<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnetic Buttons demo</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        overflow-x: hidden;
        background-color: #0a0d14;
        color: #e1dcc9;
        font-family: sans-serif;
      }
      .hero {
        min-height: 40vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 0 24px;
      }
      .demo-grid {
        min-height: 46vh;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        align-items: start;
        justify-items: center;
        column-gap: 48px;
        row-gap: 28px;
        padding: 40px 24px;
        border-top: 1px solid #201d3d;
      }
      .demo-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 16px;
      }
      .demo-row h2 {
        font-size: 16px;
        color: #ffd166;
        text-align: center;
      }
      .demo-row p.hint {
        max-width: 480px;
        text-align: center;
        opacity: 0.6;
        font-size: 13px;
        margin-top: -16px;
      }

      button.magnetic {
        appearance: none;
        border: none;
        cursor: pointer;
        padding: 22px 46px;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        font-family: inherit;
        will-change: transform;
      }
      button.basic {
        background: #78a5ee;
        color: #0a0d14;
      }
      button.layered {
        background: transparent;
        color: #e1dcc9;
        border: 1.5px solid #78a5ee;
      }
      .magnetic-content {
        display: inline-block;
        will-change: transform;
      }
      button.field {
        background: #ffd166;
        color: #0a0d14;
      }
    </style>
  </head>

  <body>
    <div class="hero">
      <h1>Magnetic buttons</h1>
    </div>

    <div class="demo-grid">
      <section class="demo-row">
        <h2>1. Basic</h2>
        <button class="magnetic basic">Hover me</button>
      </section>

      <section class="demo-row">
        <h2>2. Layered</h2>
        <button class="magnetic layered">
          <span class="magnetic-content">Hover me</span>
        </button>
      </section>

      <section class="demo-row">
        <h2>3. Field</h2>
        <button class="magnetic field" data-radius="240">Get close</button>
      </section>
    </div>

    <script type="module">
      import { six } from "https://unpkg.com/@six-js/core@latest/dist/index.js";

      // ---------------- 1. basic----------------
      function magneticHover(
        el,
        { strength = 0.4, duration = 0.5, releaseDuration = 0.6 } = {},
      ) {
        el.addEventListener("pointermove", (e) => {
          const rect = el.getBoundingClientRect();
          const relX = e.clientX - (rect.left + rect.width / 2);
          const relY = e.clientY - (rect.top + rect.height / 2);
          six.to(el, {
            x: relX * strength,
            y: relY * strength,
            duration,
            ease: "quadOut",
          });
        });
        el.addEventListener("pointerleave", () => {
          six.to(el, { x: 0, y: 0, duration: releaseDuration, ease: "elasticOut" });
        });
      }
      magneticHover(document.querySelector(".basic"));

      // ---------------- 2. layered ----------------

      const layeredBtn = document.querySelector(".layered");
      const layeredContent = layeredBtn.querySelector(".magnetic-content");

      layeredBtn.addEventListener("pointermove", (e) => {
        const rect = layeredBtn.getBoundingClientRect();
        const relX = e.clientX - (rect.left + rect.width / 2);
        const relY = e.clientY - (rect.top + rect.height / 2);
        six.to(layeredBtn, {
          x: relX * 0.25,
          y: relY * 0.25,
          duration: 0.5,
          ease: "quadOut",
        });
        six.to(layeredContent, {
          x: relX * 0.5,
          y: relY * 0.5,
          duration: 0.5,
          ease: "quadOut",
        });
      });
      layeredBtn.addEventListener("pointerleave", () => {
        six.to(layeredBtn, { x: 0, y: 0, duration: 0.6, ease: "elasticOut" });
        six.to(layeredContent, { x: 0, y: 0, duration: 0.6, ease: "elasticOut" });
      });

      // ---------------- 3. field ----------------

      const fieldBtn = document.querySelector(".field");
      const fieldRadius = Number(fieldBtn.dataset.radius) || 140;
      let wasInField = false;

      window.addEventListener("pointermove", (e) => {
        const rect = fieldBtn.getBoundingClientRect();
        const dx = e.clientX - (rect.left + rect.width / 2);
        const dy = e.clientY - (rect.top + rect.height / 2);
        const dist = Math.hypot(dx, dy);
        const inField = dist < fieldRadius;

        if (inField) {
          const pull = 1 - dist / fieldRadius;
          six.to(fieldBtn, {
            x: dx * pull * 0.8,
            y: dy * pull * 0.8,
            duration: 0.4,
            ease: "quadOut",
          });
        } else if (wasInField) {
          six.to(fieldBtn, { x: 0, y: 0, duration: 0.4, ease: "circOut" });
        }
        wasInField = inField;
      });
    </script>
  </body>
</html>
