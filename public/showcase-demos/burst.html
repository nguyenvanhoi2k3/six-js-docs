<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>burst() demo</title>
    <style>
/* 1. Use a more-intuitive box-sizing model */
*,
*::before,
*::after {
  box-sizing: border-box;
}

/* 2. Remove default margin */
*:not(dialog) {
  margin: 0;
}

/* 3. Enable keyword animations */
@media (prefers-reduced-motion: no-preference) {
  html {
    interpolate-size: allow-keywords;
  }
}

body {
  /* 4. Increase line-height */
  line-height: 1.5;
  /* 5. Improve text rendering */
  -webkit-font-smoothing: antialiased;
  font-family: sans-serif;
}

/* 6. Improve media defaults */
img,
picture,
video,
canvas,
svg {
  display: block;
  max-width: 100%;
}

/* 7. Inherit fonts for form controls */
input,
button,
textarea,
select {
  font: inherit;
}

/* 8. Avoid text overflows */
p,
h1,
h2,
h3,
h4,
h5,
h6 {
  overflow-wrap: break-word;
}

/* 9. Improve line wrapping */
p {
  text-wrap: pretty;
}
h1,
h2,
h3,
h4,
h5,
h6 {
  text-wrap: balance;
}

/*
  10. Create a root stacking context
*/
#root,
#__next {
  isolation: isolate;
}

/* -------------------- */
.box {
  width: 200px;
  height: 200px;
  background-color: #30364f;
  color: #f0f0db;
}

.box2 {
  width: 200px;
  height: 200px;
  background-color: #ffb4b4;
}

.box3 {
  width: 200px;
  height: 200px;
  background-color: #c6ffb4;
}

.slide {
  background-color: #ccc;
  width: 100%;
  height: 400px;
}

.space {
  height: 100vh;
}

.flex-center {
  display: flex;
  justify-content: center;
  align-items: center;
}

.flex {
  display: flex;
}

.jc-center {
  justify-content: center;
}

.ai-center {
  align-items: center;
}

/* -------- */

.img {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 200px;
  opacity: 0;
}

/* -------- cursor follow demo -------- */
.cursor-box {
  position: fixed;
  top: 0;
  left: 0;
  width: 60px;
  height: 60px;
  background-color: #78a5ee;
  border-radius: 8px;
  pointer-events: none;
  z-index: 9999;
}

.container {
  font-size: 104px;
  font-weight: 900;
  font-family: sans-serif;
}
html,
body {
  overflow-x: hidden;
  background-color: #0A0D14;
  color: #E1DCC9;
}

.space {
  height: 100vh;
}

    </style>
    <style>
      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      .hero-text {
        margin: 0;
        font-size: clamp(48px, 11vw, 150px);
        font-weight: 800;
        text-align: center;
        white-space: nowrap;
        letter-spacing: -0.02em;
        color: #ffd166;
      }
      #heart {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 class="hero-text" id="heroText">Sixjs Library</h1>
    </div>
    <div class="space flex-center">
      <button id="like">❤️ Like</button>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="96"
        height="96"
        fill="#e6d1d1"
        viewBox="0 0 256 256"
        id="heart"
      >
        <path
          d="M206.83,125.17a4,4,0,0,1,0,5.66l-82.06,82a52,52,0,0,1-73.54-73.55L150.52,38.55a36,36,0,1,1,50.94,50.9l-99.3,100.69a20,20,0,1,1-28.3-28.27l83.29-84.68a4,4,0,1,1,5.7,5.61L79.54,167.5a12,12,0,1,0,16.95,17L195.78,83.81A28,28,0,1,0,156.2,44.18L56.91,144.87a44,44,0,1,0,62.21,62.26l82-82A4,4,0,0,1,206.83,125.17Z"
        ></path>
      </svg>
    </div>
    <div class="space"></div>
    <div class="space"></div>
    <div class="space"></div>

    <script type="module">
      import { six } from "https://unpkg.com/@six-js/core@latest/dist/index.js";
      import { SplitText } from "https://unpkg.com/@six-js/core@latest/dist/SplitText.js";
      import { Burst } from "https://unpkg.com/@six-js/core@latest/dist/Burst.js";
      document.querySelector("#like").addEventListener("click", (e) => {
        Burst(e.currentTarget, {
          targets: "#heart",
          clone: 20,
          power: [400, 500],
          spread: [-45, 45],
        });
      });
      const heroText = document.getElementById("heroText");

      six.set(heroText, { y: -window.innerHeight });

      six.to(heroText, {
        y: 0,
        duration: 1.3,
        ease: "bounceOut",
        onComplete: () => {
          const heroCharSplit = new SplitText(heroText, {
            type: "chars",
            charsClass: "hero-char",
          });
         
          Burst(heroText, {
            targets: heroCharSplit.chars,
            spread: [-45, 45],
            power: [460, 600],
            gravity: 1200,
            duration: [1, 1.8],
            rotationSpeed: [-100, 100],
            stagger: 0.01
          });
        },
      });
    </script>
  </body>
</html>
