<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>burst() demo</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        overflow-x: hidden;
        background-color: #0a0d14;
        color: #e1dcc9;
        font-family: sans-serif;
      }

      .space {
        height: 100vh;
      }

      .flex-center {
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
    <style>
      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      .hero-text {
        transform: translateY(-100vh);
        margin: 0;
        font-size: clamp(48px, 11vw, 150px);
        font-weight: 800;
        text-align: center;
        white-space: nowrap;
        letter-spacing: -0.02em;
        color: #ffd166;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1 class="hero-text" id="heroText">Sixjs Library</h1>
    </div>

    <div class="space flex-center">END</div>

    <script type="module">
      import { six } from "https://unpkg.com/@six-js/core@latest/dist/index.js";
      import { SplitText } from "https://unpkg.com/@six-js/core@latest/dist/SplitText.js";
      import { Burst } from "https://unpkg.com/@six-js/core@latest/dist/Burst.js";

      const heroText = document.getElementById("heroText");

      six.to(heroText, {
        y: 0,
        duration: 1.3,
        ease: "bounceOut",
        // sau khi đi vào màn hình
        onComplete: () => {
          const heroCharSplit = new SplitText(heroText, {
            type: "chars",
            charsClass: "hero-char",
          });

          Burst(heroText, {
            targets: heroCharSplit.chars, // các phần tử sẽ bị tách nhỏ và bắn ra
            spread: [-45, 45], // khoảng góc bắn từ -45deg -> 45deg
            power: [460, 600], // tốc độ bắn ban đầu
            gravity: 1200, // gia tốc trọng lực kéo các mảnh rơi xuống
            duration: [1, 1.8], // khoảng thời gian tồn tại của mỗi mảnh trước khi biến mất, đơn vị giây
            rotationSpeed: [-100, 100], // khoảng tốc độ xoay khi đang bay, đơn vị độ/s
            stagger: 0.01, // độ trễ giữa lần bắn của mỗi mảnh, đơn vị giây
          });
        },
      });
    </script>
  </body>
</html>
